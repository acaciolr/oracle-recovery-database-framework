# =============================================================================
# ORACLE RECOVERY BRABO - perfis de media manager
#
# A logica de restore NAO conhece nenhum media manager. Ela pede o bloco de
# canais ao modulo channels.sh, que monta a partir do perfil ativo aqui.
# Trocar de NetBackup para TSM nao toca em nenhum modulo de recovery.
#
# Chaves reconhecidas:
#   MEDIA_NAME     rotulo livre
#   MEDIA_TYPE     DISK | SBT_TAPE
#   LIBRARY        caminho da biblioteca SBT (informativo/PARMS)
#   PARMS          string PARMS do ALLOCATE CHANNEL
#   SEND           string do comando SEND (vazio = nenhum SEND)
#   FORMAT         FORMAT do canal
#   CHANNELS       paralelismo padrao deste perfil
#   MAXPIECESIZE   ex: 200G
#   SECTION_SIZE   ex: 64G
#   FILESPERSET    ex: 1
#   RATE           ex: 100M
# =============================================================================

[DISK]
MEDIA_NAME   = DISK
MEDIA_TYPE   = DISK
CHANNELS     = 4
FORMAT       = /backup/%d_%U

# -----------------------------------------------------------------------------
# NetBackup
#
# NB_ORA_CLIENT       nome do cliente NetBackup dono do backup. Em restore
#                     cruzado (host diferente do que gerou o backup) este e o
#                     parametro que decide se os pieces sao encontrados.
# NB_ORA_CATALOG_HOST usar quando o backup foi catalogado sob outro host.
# NB_ORA_SERV         master server.
#
# "not found in NetBackup catalog" no restore costuma ser um destes dois
# errados - ou expiracao real da imagem. Confirme com o time de backup antes
# de assumir expiracao.
# -----------------------------------------------------------------------------
[NETBACKUP]
MEDIA_NAME   = NETBACKUP
MEDIA_TYPE   = SBT_TAPE
LIBRARY      = /usr/openv/netbackup/bin/libobk.a64
SEND         = NB_ORA_CLIENT=<client>,NB_ORA_SERV=<master>
CHANNELS     = 4

[NETBACKUP_CATALOG_HOST]
MEDIA_NAME   = NETBACKUP
MEDIA_TYPE   = SBT_TAPE
LIBRARY      = /usr/openv/netbackup/bin/libobk.a64
SEND         = NB_ORA_CATALOG_HOST=<host>,NB_ORA_SERV=<master>
CHANNELS     = 4

# -----------------------------------------------------------------------------
# IBM Spectrum Protect (TSM) - configuracao via PARMS, nao via SEND
# -----------------------------------------------------------------------------
[TSM]
MEDIA_NAME   = SPECTRUM_PROTECT
MEDIA_TYPE   = SBT_TAPE
LIBRARY      = /usr/lib/libobk64.so
PARMS        = ENV=(TDPO_OPTFILE=/usr/tivoli/tsm/client/oracle/bin64/tdpo.opt)
CHANNELS     = 4

# -----------------------------------------------------------------------------
# Commvault
# -----------------------------------------------------------------------------
[COMMVAULT]
MEDIA_NAME   = COMMVAULT
MEDIA_TYPE   = SBT_TAPE
LIBRARY      = /opt/commvault/Base/libobk.so
PARMS        = SBT_LIBRARY=/opt/commvault/Base/libobk.so,ENV=(CV_mmsApiVsn=2)
CHANNELS     = 4

# -----------------------------------------------------------------------------
# Oracle Secure Backup
# -----------------------------------------------------------------------------
[OSB]
MEDIA_NAME   = ORACLE_SECURE_BACKUP
MEDIA_TYPE   = SBT_TAPE
LIBRARY      = /usr/local/oracle/backup/lib/libobk.so
CHANNELS     = 2

# -----------------------------------------------------------------------------
# Biblioteca SBT generica - preencha PARMS conforme o fornecedor
# -----------------------------------------------------------------------------
[SBT_CUSTOM]
MEDIA_NAME   = CUSTOM
MEDIA_TYPE   = SBT_TAPE
LIBRARY      = /path/para/libobk.so
PARMS        = SBT_LIBRARY=/path/para/libobk.so
CHANNELS     = 2
