# =============================================================================
# ORACLE RECOVERY BRABO - configuracao global
#
# Este arquivo e carregado com '.' (source), entao e shell valido.
# Tudo aqui pode ser sobrescrito por variavel de ambiente ou por --opcao.
# =============================================================================

# -----------------------------------------------------------------------------
# AMBIENTE
# Vazio = descoberta automatica (oratab, PATH, variavel de ambiente).
# Preencha somente se a descoberta errar.
# -----------------------------------------------------------------------------
# ORACLE_HOME=""
# ORACLE_SID=""
# ORACLE_BASE=""

# -----------------------------------------------------------------------------
# RECOVERY CATALOG
#
# Sem catalogo o RMAN so enxerga o que cabe em control_file_record_keep_time
# (7 dias por padrao). Backups mais antigos ficam invisiveis e o RMAN pode
# tentar CRIAR datafile em vez de restaurar - ORA-01180.
#
# Quoting: aspas SIMPLES por fora, DUPLAS na senha. Obrigatorio se a senha
# tiver # @ $ ou outro caractere especial.
#
# Preferir wallet ou autenticacao de SO sempre que possivel. Senha em arquivo
# de configuracao e o ultimo recurso - se usar, proteja com chmod 600.
# -----------------------------------------------------------------------------
ORB_CATALOG_CONNECT=''
# ORB_CATALOG_CONNECT='rman_user/"senha#com#hash"@CATALOGO'
# ORB_CATALOG_CONNECT='/@CATALOGO_WALLET'

# -----------------------------------------------------------------------------
# MEDIA MANAGER
# Perfil a carregar de conf/media.conf. Vazio = primeiro perfil do arquivo.
# -----------------------------------------------------------------------------
ORB_MEDIA_PROFILE="DISK"

# -----------------------------------------------------------------------------
# CANAIS
# Mais canais so ajudam se houver drives/streams livres no media manager.
# Alinhe com o time de backup antes de subir muito.
# -----------------------------------------------------------------------------
ORB_CHANNELS=4

# -----------------------------------------------------------------------------
# MODO DE OPERACAO
#   EXECUTE   executa apos confirmacao
#   DRYRUN    mostra o plano e nao executa nada
#   GENERATE  grava o plano em scripts/ e nao executa nada
# -----------------------------------------------------------------------------
ORB_MODE="EXECUTE"

# -----------------------------------------------------------------------------
# DIRETORIOS  (relativos a raiz do projeto quando nao absolutos)
# -----------------------------------------------------------------------------
ORB_LOGDIR="logs"
ORB_SCRIPTDIR="scripts"

# -----------------------------------------------------------------------------
# INTERFACE
# -----------------------------------------------------------------------------
ORB_COLOR="N"

# -----------------------------------------------------------------------------
# BACKUP HEALTH
#
# Limites do monitor. Sao eles que teriam pego, em marco de 2025, um banco
# ficando 17 meses sem backup nivel 0.
# -----------------------------------------------------------------------------
ORB_HEALTH_L0_WARN_DAYS=8        # aviso  se o ultimo nivel 0 for mais velho
ORB_HEALTH_L0_CRIT_DAYS=31       # critico
ORB_HEALTH_ARCH_WARN_HOURS=26    # aviso  se nao houver backup de archivelog
ORB_HEALTH_ARCH_CRIT_HOURS=72    # critico
ORB_HEALTH_MAIL=""               # destinatario do alerta (vazio = so stdout)
